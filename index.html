<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soundboard</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 20px; 
            background: #1e1e2e; 
            color: #fff;
            text-align: center; 
        }
        #board { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 15px; 
            justify-content: center; 
            max-width: 600px;
            margin: 30px auto; 
        }
        .sound-btn {
            padding: 15px 25px;
            font-size: 16px;
            font-weight: bold;
            background-color: #74c7ec;
            color: #11111b;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: all 0.15s ease;
            text-transform: capitalize;
            min-width: 140px;
        }
        .sound-btn:hover { background-color: #89dceb; transform: translateY(-2px); }
        .sound-btn:active { transform: translateY(0); background-color: #94e2d5; }
    </style>
</head>
<body>

    <h1>🔊 Soundboard</h1>
    <div id="board"></div>

<script>
    const sounds = [
        'ring.m4a',
        'reveal.m4a',
        'chime.m4a',
        'end.m4a',
        'footsteps.m4a',
        'court_chatter.m4a',
        'shock.m4a',
        'come home.m4a'
    ];

    const soundFolder = './';
    const board = document.getElementById('board');
    
    // Khởi tạo Web Audio API
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    let currentSource = null;

    sounds.forEach(file => {
        const btn = document.createElement('button');
        btn.className = 'sound-btn';
        
        const label = file.replace('.m4a', '').replace(/_/g, ' ');
        btn.innerText = label;

        btn.onclick = async () => {
            // Khởi tạo AudioContext ở lần click đầu tiên (bắt buộc theo chính sách trình duyệt)
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }

            // Dừng âm thanh đang phát trước đó
            if (currentSource) {
                currentSource.stop();
            }

            try {
                // 1. Tải file âm thanh
                const response = await fetch(soundFolder + encodeURIComponent(file));
                const arrayBuffer = await response.arrayBuffer();
                const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

                // 2. Tạo bộ nguồn phát (BufferSource)
                const source = audioCtx.createBufferSource();
                source.buffer = audioBuffer;

                // 3. Tạo bộ khuếch đại (GainNode) - Tăng 500%
                const gainNode = audioCtx.createGain();
                gainNode.gain.value = 5.0; // 5.0 = 500% (1.0 = 100%)

                // 4. Kết nối: Nguồn -> Khuếch đại -> Loa
                source.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                // 5. Phát âm thanh
                source.start(0);
                currentSource = source;
            } catch (err) {
                console.error("Lỗi phát âm thanh:", err);
            }
        };

        board.appendChild(btn);
    });
</script>
</body>
</html>
