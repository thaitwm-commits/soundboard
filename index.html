<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soundboard</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 20px; 
            background: #1e1e2e; 
            color: #fff;
            text-align: center; 
        }
        #board { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 15px; 
            justify-content: center; 
            max-width: 600px;
            margin: 30px auto; 
        }
        .sound-btn {
            padding: 15px 25px;
            font-size: 16px;
            font-weight: bold;
            background-color: #74c7ec;
            color: #11111b;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: all 0.15s ease;
            text-transform: capitalize;
            min-width: 140px;
        }
        .sound-btn:hover { background-color: #89dceb; transform: translateY(-2px); }
        .sound-btn:active { transform: translateY(0); background-color: #94e2d5; }
    </style>
</head>
<body>

    <h1>🔊 Soundboard</h1>
    <div id="board"></div>

    <script>
        // Danh sách file m4a từ ảnh của bạn
        const sounds = [
            'ring.m4a',
            'reveal.m4a',
            'chime.m4a',
            'end.m4a',
            'footsteps.m4a',
            'court_chatter.m4a',
            'shock.m4a',
            'come home.m4a'
        ];

        const soundFolder = './';
        const board = document.getElementById('board');
        let currentAudio = null;

        sounds.forEach(file => {
            const btn = document.createElement('button');
            btn.className = 'sound-btn';
            
            // Đổi tên file thành nhãn hiển thị đẹp (bỏ đuôi .m4a, đổi dấu _ thành khoảng trắng)
            const label = file.replace('.m4a', '').replace(/_/g, ' ');
            btn.innerText = label;

            btn.onclick = () => {
                // Nếu đang phát nhạc khác thì dừng lại trước khi phát nhạc mới
                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio.currentTime = 0;
                }
                currentAudio = new Audio(soundFolder + encodeURIComponent(file));
                currentAudio.play();
            };

            board.appendChild(btn);
        });
    </script>
</body>
</html>
