<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shakespeare Soundboard & BGM</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 20px; 
            background: #11111b; 
            color: #cdd6f4;
            text-align: center; 
        }
        .container { max-width: 700px; margin: 0 auto; }
        .section {
            background: #1e1e2e;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h2 { margin-top: 0; color: #89b4fa; }
        
        .volume-control {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
            background: #181825;
            padding: 10px;
            border-radius: 8px;
        }
        input[type=range] { cursor: pointer; width: 50%; }

        .board { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 12px; 
            justify-content: center; 
        }
        
        .sound-btn {
            padding: 12px 20px;
            font-size: 15px;
            font-weight: bold;
            background-color: #313244;
            color: #cdd6f4;
            border: 2px solid #45475a;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: capitalize;
            min-width: 120px;
        }
        .sound-btn:hover { background-color: #45475a; border-color: #89b4fa; }
        
        .bgm-btn.active {
            background-color: #a6e3a1;
            color: #11111b;
            border-color: #a6e3a1;
            box-shadow: 0 0 10px rgba(166, 227, 161, 0.5);
        }
        .bgm-btn.stopping {
            background-color: #fab387;
            color: #11111b;
            border-color: #fab387;
        }

        .stop-bgm-btn {
            background-color: #f38ba8;
            color: #11111b;
            font-weight: bold;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
        }
        .stop-bgm-btn:hover { background-color: #eba0ac; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎭 Soundboard & BGM Control</h1>

    <!-- KHU VỰC 1: NHẠC NỀN BGM -->
    <div class="section">
        <h2>🎵 Nhạc Nền BGM (Loop)</h2>
        <div class="volume-control">
            <span>🔊 Âm lượng BGM:</span>
            <input type="range" id="bgmVolume" min="0" max="1" step="0.01" value="0.5">
            <span id="bgmVolVal">50%</span>
        </div>
        <div class="board" id="bgmBoard"></div>
        <button class="stop-bgm-btn" id="stopBgmBtn">⏹ Tắt BGM (Giảm dần đến hết bài)</button>
    </div>

    <!-- KHU VỰC 2: SOUND EFFECTS (KHUẾCH ĐẠI 500%) -->
    <div class="section">
        <h2>🔊 Hiệu Ứng Soundboard (Max 500%)</h2>
        <div class="volume-control">
            <span>⚡ Âm lượng SFX:</span>
            <!-- Max slider = 5 tương đương 500% -->
            <input type="range" id="sfxVolume" min="0" max="5" step="0.1" value="5">
            <span id="sfxVolVal">500%</span>
        </div>
        <div class="board" id="sfxBoard"></div>
    </div>
</div>

<script>
    const soundFolder = './';

    const bgmFiles = ['court.m4a', 'home.m4a'];
    const sfxFiles = ['ring.m4a', 'reveal.m4a', 'chime.m4a', 'end.m4a', 'footsteps.m4a', 'court_chatter.m4a', 'shock.m4a', 'come home.m4a'];

    // --- QUẢN LÝ BGM ---
    let currentBgmAudio = null;
    let activeBgmBtn = null;
    const bgmVolSlider = document.getElementById('bgmVolume');

    bgmVolSlider.addEventListener('input', (e) => {
        const val = e.target.value;
        document.getElementById('bgmVolVal').innerText = Math.round(val * 100) + '%';
        if (currentBgmAudio) currentBgmAudio.volume = val;
    });

    const bgmBoard = document.getElementById('bgmBoard');
    bgmFiles.forEach(file => {
        const btn = document.createElement('button');
        btn.className = 'sound-btn bgm-btn';
        btn.innerText = file.replace('.m4a', '').replace(/_/g, ' ');

        btn.onclick = () => playBGM(file, btn);
        bgmBoard.appendChild(btn);
    });

    function playBGM(file, btn) {
        if (currentBgmAudio && activeBgmBtn === btn) {
            stopBgmWithFadeOut();
            return;
        }

        if (currentBgmAudio) {
            currentBgmAudio.pause();
            if (activeBgmBtn) activeBgmBtn.classList.remove('active', 'stopping');
        }

        currentBgmAudio = new Audio(soundFolder + encodeURIComponent(file));
        currentBgmAudio.loop = true;
        currentBgmAudio.volume = bgmVolSlider.value;
        currentBgmAudio.play();

        activeBgmBtn = btn;
        btn.classList.add('active');
    }

    document.getElementById('stopBgmBtn').onclick = stopBgmWithFadeOut;

    function stopBgmWithFadeOut() {
        if (!currentBgmAudio) return;

        const audioToStop = currentBgmAudio;
        const btnToReset = activeBgmBtn;

        if (btnToReset) {
            btnToReset.classList.remove('active');
            btnToReset.classList.add('stopping');
        }

        let fadeInterval = setInterval(() => {
            if (audioToStop.volume > 0.05) {
                audioToStop.volume -= 0.05;
            } else {
                clearInterval(fadeInterval);
                audioToStop.pause();
                audioToStop.currentTime = 0;
                if (btnToReset) btnToReset.classList.remove('stopping');
            }
        }, 100);

        currentBgmAudio = null;
        activeBgmBtn = null;
    }

    // --- QUẢN LÝ SOUNDBOARD SFX (WEB AUDIO API KHUẾCH ĐẠI 500%) ---
    const sfxVolSlider = document.getElementById('sfxVolume');
    
    // Audio Context & Gain Node dành riêng cho SFX
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    let sfxGainNode = null;
    let currentSfxSource = null;

    sfxVolSlider.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        document.getElementById('sfxVolVal').innerText = Math.round(val * 100) + '%';
        // Điều chỉnh Gain trực tiếp trong khi sound đang chạy
        if (sfxGainNode) {
            sfxGainNode.gain.value = val;
        }
    });

    const sfxBoard = document.getElementById('sfxBoard');
    sfxFiles.forEach(file => {
        const btn = document.createElement('button');
        btn.className = 'sound-btn';
        btn.innerText = file.replace('.m4a', '').replace(/_/g, ' ');

        btn.onclick = async () => {
            // Khởi tạo AudioContext ở click đầu tiên
            if (!audioCtx) {
                audioCtx = new AudioContext();
                sfxGainNode = audioCtx.createGain();
                sfxGainNode.connect(audioCtx.destination);
            }
            if (audioCtx.state === 'suspended') {
                await audioCtx.resume();
            }

            // Ngắt soundboard trước đó nếu đang phát
            if (currentSfxSource) {
                try { currentSfxSource.stop(); } catch(e) {}
            }

            try {
                // Tải dữ liệu âm thanh
                const response = await fetch(soundFolder + encodeURIComponent(file));
                const arrayBuffer = await response.arrayBuffer();
                const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

                // Tạo nguồn âm thanh mới
                const source = audioCtx.createBufferSource();
                source.buffer = audioBuffer;

                // Áp dụng mức âm lượng từ slider (Max 5 = 500%)
                sfxGainNode.gain.value = parseFloat(sfxVolSlider.value);

                source.connect(sfxGainNode);
                source.start(0);
                currentSfxSource = source;
            } catch (err) {
                console.error("Lỗi phát SFX:", err);
            }
        };

        sfxBoard.appendChild(btn);
    });
</script>

</body>
</html>
